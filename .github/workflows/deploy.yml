name: Build and Deploy to k8s

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --build-arg BUILD_SHA=${{ env.SHORT_SHA }} -t rohit1kumar/node-redis-api:${{ env.SHORT_SHA }} .

      - name: Push Docker image
        run: |
          docker push rohit1kumar/node-redis-api:${{ env.SHORT_SHA }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/api \
          api=rohit1kumar/node-redis-api:${{ env.SHORT_SHA }} \
          -n myapp

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/api -n myapp
